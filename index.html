<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wealthflow — dev</title>
    <link rel="stylesheet" href="/src/styles/ext-tokens.css" />
    <style>
      #view-switcher {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 9999;
        padding: 4px 8px;
        font-size: 12px;
        background: var(--ff-bg-secondary, #1e1e1e);
        color: var(--ff-text-primary, #ccc);
        border: 1px solid var(--ff-border, #444);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <select id="view-switcher"></select>
    <script type="module">
      import '/src/ui/index.ts';
      import { createMockFinance } from '/src/mock/finance-mock.ts';
      import {
        currentFy,
        TAB_LABELS,
      } from '/src/ui/wealthflow-orchestrator.ts';
      import * as main from '/src/main.ts';

      // ---- one entry per real view, in the same order as the app's nav ----
      // These mirror package.json#financeExtension.contributions.navigation:
      // the same three views, addressed by the same `view` value their command
      // passes to finance.ui.requestMount. The dropdown is a stand-in for the
      // sidebar, not a list of components — a nested child like interest-grid
      // has no nav item and is not offered here. Add a view here and add its
      // navigation entry in package.json too.
      const VIEWS = [
        { view: 'overview', label: TAB_LABELS.overview },
        { view: 'banks', label: TAB_LABELS.banks },
        { view: 'stocks', label: TAB_LABELS.stocks },
      ];

      const switcher = document.getElementById('view-switcher');
      VIEWS.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.text = v.label;
        switcher.appendChild(opt);
      });

      const finance = createMockFinance();
      // Dev console hook for the gitignored seed module:
      //   const m = await import('/src/seed/wealth-seed.ts');
      //   await m.seedWealthflow(window.__finance);
      window.__finance = finance;
      // Dev console helper for the public domain service, so a cross-extension
      // consumer can be exercised without a second extension in the page.
      // Params go in as an array because the host spreads them positionally:
      //   await __svc('getOverviewSummary', '2026-2027')
      window.__svc = (method, ...args) =>
        finance.services.invoke('wealthflow', method, args);
      // Child views are FY-driven and the orchestrator takes an explicit FY in
      // its mount payload, so the page has to hand one over — which is what
      // panel-bootstrap passes in the real app.
      const FY = currentFy();
      // One panel for the whole session, exactly as in the app: switching views
      // retargets it in place rather than tearing the element down and back up.
      const panel = document.createElement('wealthflow-orchestrator');
      document.getElementById('app').appendChild(panel);

      // ---- ?seed (or ?seed=1) loads src/seed/wealth-seed.ts before mount ----
      // The seed module is gitignored, so a missing file is not an error: the
      // dev DB just stays empty. Applies to every view in the VIEWS dropdown.
      if (/(?:^|[?&])seed(?:=1)?(?:&|$)/.test(location.search)) {
        try {
          const seed = await import(
            /* @vite-ignore */ '/src/seed/wealth-seed.ts'
          );
          const done = await seed.seedWealthflow(finance);
          console.info('[wealthflow] seeded', done);
        } catch (e) {
          console.warn('[wealthflow] seed skipped:', e?.message ?? e);
        }
      }

      // Registers the commands and the public 'wealthflow' service once. It is
      // deliberately called WITHOUT a viewId: with one, activate() clears #app
      // and mounts an orchestrator of its own, which would replace the panel
      // this page owns (and re-register the service on every switch).
      await main.activate(finance, {});

      // The same retarget the sidebar performs: in the app the host dispatches
      // 'mount-update' on #app and the orchestrator's listener calls init() with
      // the view, so drive init() directly rather than re-dispatching an event
      // nothing is listening for (activate() only wires that listener when it
      // is given a viewId, and this page owns the panel instead).
      async function showView(index) {
        const v = VIEWS[index];
        if (!v) return;
        switcher.value = String(index);
        await panel.init(finance, { view: v.view, fy: FY });
        await panel.updateComplete;
      }

      switcher.value = '0';
      switcher.addEventListener('change', (e) => {
        void showView(+e.target.value);
      });
      await panel.init(finance, { view: VIEWS[0].view, fy: FY });
      await panel.updateComplete;
    </script>
  </body>
</html>
